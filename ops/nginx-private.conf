# Included inside the existing HTTPS server block.
location = /thoughts {
    return 303 /thoughts/;
}
location ^~ /thoughts/ {
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_cache off;
}
location ^~ /_private/ {
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_cache off;
}
