{{ define "main" }}
<section class="article">
  <h1>{{ .Title }}</h1>
  <div class="post-list">
    {{ range .Pages }}
    <article class="post-item">
      <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
      <div>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <p>{{ .Summary }}</p>
      </div>
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
